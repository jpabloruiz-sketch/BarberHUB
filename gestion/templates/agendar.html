<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberHUB | Agendar Cita</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <style>
        body{
            background: #0d0d0d;
            color: #d4af37;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .contenedor{
            width: 100%;
            max-width: 900px;
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 0px 25px rgba(212,175,55,0.25);
        }

        h1{
            text-align: center;
            color: #d4af37;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        form p{
            margin-bottom: 20px;
        }

        form label{
            color: #f5c542;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        form input,
        form select,
        form textarea{
            width: 100%;
            padding: 12px;
            border: 2px solid #333;
            border-radius: 10px;
            background: #111;
            color: white;
            transition: 0.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus{
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212,175,55,0.5);
            outline: none;
        }

        .btn-confirmar{
            background: linear-gradient(45deg,#d4af37,#ffd700);
            color: black;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            transition: .3s;
        }

        .btn-confirmar:hover{
            transform: scale(1.03);
            background: linear-gradient(45deg,#ffd700,#d4af37);
        }

        .table{
            margin-top: 40px;
            color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .table thead{
            background: #d4af37;
            color: black;
        }

        .table tbody tr{
            background: #222;
        }

        .table tbody tr:hover{
            background: #333;
        }

        .table td,
        .table th{
            border-color: #444;
            padding: 15px;
        }

        @media(max-width:768px){
            .contenedor{
                padding: 20px;
            }

            h1{
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>💈 Agenda tu Cita</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn-confirmar" type="submit">
            Confirmar Cita
        </button>

        <table class="table table-dark mt-5">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Cliente</th>
                    <th>Servicio</th>
                    <th>Hora</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <th>1</th>
                    <td>Juan</td>
                    <td>Corte Clásico</td>
                    <td>10:00 AM</td>
                </tr>

                <tr>
                    <th>2</th>
                    <td>Carlos</td>
                    <td>Barba Premium</td>
                    <td>11:30 AM</td>
                </tr>

                <tr>
                    <th>3</th>
                    <td>Andrés</td>
                    <td>Corte + Barba</td>
                    <td>02:00 PM</td>
                </tr>
            </tbody>
        </table>

    </form>

</div>

</body>
</html>
